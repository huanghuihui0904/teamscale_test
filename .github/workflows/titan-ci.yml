# .github/workflows/titan-ci.yml

name: Run TITAN Security Scan

# 定义工作流的触发条件
# 这里设置为在 main 分支有 push 或 pull_request 时触发
on:
  push:
    branches: [ "main" ] # 您可以修改为您项目的主分支
  pull_request:
    branches: [ "main" ] # 您可以修改为您项目的主分支

jobs:
  titan-scan:
    runs-on: ubuntu-latest # 使用最新的 Ubuntu 运行环境
    steps:
      # 步骤1：检出您的代码
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run TITAN Security Scan
        uses: titanfyp/titan-ci-tool@v1.0.0
        with:
          # api_base_url: ${{ secrets.TITAN_API_BASE_URL }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          report_format: 'xml'
          timeout_seconds: 300
          blocking: true
          block_percentage: 70
      
      - name: Security scan summary
        if: failure()
        run: |
          echo "Security scan completed but found vulnerabilities above threshold"
          echo "Review the security report to identify and fix the issues"
          echo "Build failed due to security policy enforcement"
      
      - name: Upload security report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: security_report.*
          retention-days: 30
